name: Navigation integration probe

on:
  push:
    branches:
      - codex/za-integrated-2026-11-26
    paths:
      - .github/workflows/nav-merge-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge tap-navigation branch into isolated probe
        shell: bash
        run: |
          set -e
          git config user.name "ZAISAKU Integration"
          git config user.email "integration@users.noreply.github.com"
          git checkout -b codex/za-nav-merge-probe-2026-11-26
          git fetch origin refs/heads/cursor/tap-navigation-3643
          git merge --no-commit --no-ff FETCH_HEAD || true
          echo "Merge conflict paths:"
          git diff --name-only --diff-filter=U || true
          echo "Conflict marker counts:"
          grep -R -l '^<<<<<<< ' --include='*.ts' --include='*.css' web/src src tests || true
          git add -A
          git commit -m "WIP: native three-way navigation merge for isolated review"
          git push origin HEAD:refs/heads/codex/za-nav-merge-probe-2026-11-26
